[package]
name = "d3-format"
# Section 5.1 writes this as 0.1.0 and section 7's Phase 6 asks for a release
# candidate first, so the manifest carries the candidate: publish-rust.yml refuses
# to publish unless the tag and this field agree, and it cannot agree with
# `v0.1.0-rc.1` while this says 0.1.0. Stable 0.1.0 is a separate approval and a
# separate version bump.
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.80"
license = "ISC"
repository = "https://github.com/alexkhil/d3-format-rust"
description = "A Rust implementation of d3-format 3.1.2"
# Cargo would find README.md anyway; naming it is what makes the dependency
# explicit, because src/lib.rs pulls the same file in with include_str! so that
# every Rust snippet in it is a doctest rather than a prose snippet.
readme = "README.md"
keywords = ["d3", "format", "number", "locale", "formatting"]
categories = ["value-formatting", "internationalization", "localization"]
# rust-toolchain.toml is excluded because rustup resolves it by walking up from
# the build directory: shipping it would pin an unpacked-crate consumer to 1.98.1.
#
# ci/ and src/bin/ are verification tooling, not distribution. Excluding src/bin/
# drops the differential harness `dump_cases` from the published artifact: cargo
# warns `ignoring binary "dump_cases" as src/bin/dump_cases.rs is not included in
# the published package` and omits the target from the normalized manifest
# altogether, so an unpacked crate is lib-only and `cargo install d3-format` fails
# with `no packages found with binaries or examples` -- which is correct for a
# formatting library. The binary stays fully buildable and runnable from this
# repository, which is the only place the differential protocol runs.
exclude = ["ci/", "fixtures/", "rust-toolchain.toml", "src/bin/", "tools/"]

[lib]
name = "d3_format"

[features]
default = []
locales = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }

# Section 7's Phase 5 benchmark. `harness = false` hands `main` to the file, which
# it needs: section 7 forbids an "allocation-free" claim without allocator
# instrumentation, so `benches/format.rs` installs a counting global allocator and
# prints an exact allocation profile before Criterion's timing runs. Criterion
# stays at exactly 0.7.0 with default features off; 0.8 pulls `alloca` through
# `cc`, and ci/check.ps1 fails the build if either enters the graph.
[[bench]]
name = "format"
harness = false
