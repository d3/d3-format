name: Publish (crates.io)

# Section 7's Phase 6 paragraph of MIGRATION_TO_RUST.md, clause by clause: this
# workflow is separate from the existing npm publish.yml, it runs only for a
# protected manual/release environment, it verifies that the Git tag and
# Cargo.toml version agree, it reruns the pinned correctness and package gates, it
# runs `cargo publish --dry-run --locked`, it uploads the exact .crate and its
# SHA-256 as artifacts, and only then does it run `cargo publish --locked`.
#
# It never invokes npm. The JavaScript product is published by publish.yml and is
# untouched by a Rust release; section 0.1 puts replacing the npm package out of
# scope entirely. Nothing below installs Node, and the only registry it can reach
# is crates.io.
#
# The work is split into two jobs on purpose. `verify` holds no credentials and is
# not gated, so a bad tag or a red gate fails without consuming a deployment
# approval, and it publishes the candidate .crate and digest as artifacts that a
# reviewer can inspect. `publish` is the only job attached to the protected
# environment, so the crates.io identity -- a trusted-publisher OIDC exchange or the
# environment's token -- exists only in the job that actually needs it.

on:
  # A tag ref is required, not merely conventional: the version check below reads
  # github.ref_name, and there is no version to check against on a branch. Dispatch
  # the workflow with the tag selected as the ref.
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Two publications of the same tag cannot be usefully interleaved, and crates.io
# versions are immutable, so the second would fail late rather than early.
concurrency:
  group: publish-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  # Section 6.1's pinned toolchain. rust-toolchain.toml would select the same
  # channel for anything run from rust/, but naming it here means the log records
  # what built the artifact instead of leaving it to file discovery.
  RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    outputs:
      version: ${{ steps.version.outputs.version }}
      crate: ${{ steps.package.outputs.crate }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6

      - name: The tag and Cargo.toml must name the same version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw "this workflow must run on a tag ref; got a $env:GITHUB_REF_TYPE named '$env:GITHUB_REF_NAME'"
          }

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9].*)$') {
              throw "tag '$tag' is not of the form v<version>, for example v0.1.0-rc.1"
          }
          $tagVersion = $Matches['version']

          # --no-deps keeps this to the crate's own manifest, and --locked keeps
          # cargo from rewriting Cargo.lock on the way past. Reading the manifest
          # through cargo rather than with a regex means the value compared is the
          # one cargo will publish under.
          $raw = & cargo metadata --locked --format-version 1 --no-deps
          if ($LASTEXITCODE -ne 0) {
              throw "cargo metadata --locked --format-version 1 --no-deps failed with exit code $LASTEXITCODE"
          }
          $package = @(($raw -join "`n" | ConvertFrom-Json).packages)[0]

          if ($package.name -ne 'd3-format') {
              throw "expected to publish 'd3-format', but the manifest names '$($package.name)'"
          }
          if ($package.version -ne $tagVersion) {
              throw "tag '$tag' asks for version '$tagVersion', but Cargo.toml declares '$($package.version)'"
          }

          Write-Host "publishing $($package.name) $($package.version) from tag $tag"
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Section 6.1's whole check set, including `cargo package --locked`. No
      # -AllowDirty: a release builds a clean checkout, and a dirty one here would
      # mean the .crate does not correspond to the tag.
      - name: Rerun the pinned correctness and package gates
        run: ./ci/check.ps1 -Profile Pinned

      # The registry's own acceptance check: it re-packages, uploads nothing, and
      # builds the packaged crate from its own contents. That last part is what
      # catches a file the `exclude` list dropped but the sources still need.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      # Section 9's "cargo package contents are reviewed", re-asserted against the
      # tarball this release would actually upload. The collector fails if a file
      # matches no rule or if an entry in the `exclude` list has stopped holding, so
      # a release cannot quietly ship the fixture corpora or the differential
      # harness. -SkipPackage reuses what the dry run just produced.
      - name: Review the package contents
        run: ./ci/package/collect-listing.ps1 -SkipPackage

      - name: Record the .crate and its SHA-256
        id: package
        run: |
          $ErrorActionPreference = 'Stop'

          $name = "d3-format-${{ steps.version.outputs.version }}.crate"
          $path = Join-Path 'target/package' $name
          if (-not (Test-Path -LiteralPath $path)) {
              throw "no packaged crate at rust/$path"
          }

          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          # Written in the shape `sha256sum -c` accepts, so a reviewer can verify a
          # downloaded artifact with one command.
          "$hash  $name" | Out-File -FilePath "$path.sha256" -Encoding ascii

          Write-Host "$name  $hash"
          "crate=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # upload-artifact resolves `path` against the workspace root, not against the
      # job's working-directory, so these are spelled from the repository root.
      - uses: actions/upload-artifact@v4
        with:
          name: d3-format-${{ steps.version.outputs.version }}-candidate
          path: |
            rust/target/package/${{ steps.package.outputs.crate }}
            rust/target/package/${{ steps.package.outputs.crate }}.sha256
            rust/ci/package/package-listing.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The protected environment. Configure it with required reviewers and a tag
    # deployment-branch rule; it is what makes this a deliberate human action
    # rather than something a push can cause. When authentication is a
    # repository-scoped crates.io token rather than a trusted publisher, the token
    # is held here, which is why no earlier job can reach it.
    environment: crates-io-release
    permissions:
      contents: read
      # Required for the OIDC exchange in the trusted-publisher path. It grants
      # nothing on its own: crates.io mints a token only for a repository,
      # workflow filename and environment that a Trusted Publisher Configuration on
      # the crate already names.
      id-token: write
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/download-artifact@v4
        with:
          name: d3-format-${{ needs.verify.outputs.version }}-candidate
          path: reviewed-artifact

      # `cargo publish` re-packages rather than uploading a file it is handed, so
      # the artifact a reviewer looked at and the bytes that reach crates.io are the
      # same only if packaging is reproducible. That is checked rather than
      # assumed: both jobs package the same commit with the same toolchain on the
      # same image, and cargo normalizes archive timestamps for exactly this
      # reason, so a mismatch means something in the tree or the environment moved
      # between the two jobs and the release should stop.
      - name: The crate to publish must be the crate that was reviewed
        run: |
          $ErrorActionPreference = 'Stop'

          & cargo package --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo package --locked failed with exit code $LASTEXITCODE" }

          $name = '${{ needs.verify.outputs.crate }}'
          $path = Join-Path 'target/package' $name
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $reviewed = '${{ needs.verify.outputs.sha256 }}'

          if ($hash -ne $reviewed) {
              throw (@(
                  "$name does not match the artifact the verify job published:",
                  "  reviewed: $reviewed",
                  "  rebuilt : $hash",
                  '',
                  'Packaging the same commit twice produced different bytes. Do not publish;',
                  'find out what differed between the two jobs first.'
              ) -join [Environment]::NewLine)
          }

          Write-Host "$name  $hash  (matches the reviewed artifact)"

      # Section 7 allows either authentication route. The trusted-publisher path is
      # preferred and needs no stored secret, but it cannot be configured until the
      # crate exists on crates.io, so the very first publication has to use a
      # repository-scoped token held by this environment. Set the repository or
      # environment variable CRATES_IO_TRUSTED_PUBLISHING to 'true' once the
      # Trusted Publisher Configuration is in place.
      - name: Exchange an OIDC token for a crates.io token
        id: auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # Both candidates arrive as environment variables rather than as expressions
      # inside the script, so neither is ever interpolated into a command line, and
      # the step tests only whether they are empty.
      - name: An authentication route must be configured
        env:
          TRUSTED_TOKEN: ${{ steps.auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:TRUSTED_TOKEN) -and [string]::IsNullOrEmpty($env:FALLBACK_TOKEN)) {
              $message = @(
                  'no crates.io credential is available to this environment.',
                  'Either configure a Trusted Publisher on the crate and set the variable',
                  "CRATES_IO_TRUSTED_PUBLISHING to 'true', or put a repository-scoped",
                  'publishing token in the crates-io-release environment as the secret',
                  'CARGO_REGISTRY_TOKEN.'
              ) -join [Environment]::NewLine
              throw $message
          }
          if ([string]::IsNullOrEmpty($env:TRUSTED_TOKEN)) {
              Write-Host 'authenticating with the environment-held publishing token'
          } else {
              Write-Host 'authenticating with a trusted-publisher token'
          }

      - name: cargo publish
        env:
          # Empty when the exchange step was skipped, so this falls through to the
          # environment's token.
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      # The same bytes again, now as the record of what was actually published.
      - uses: actions/upload-artifact@v4
        with:
          name: d3-format-${{ needs.verify.outputs.version }}-published
          path: |
            rust/target/package/${{ needs.verify.outputs.crate }}
            reviewed-artifact/${{ needs.verify.outputs.crate }}.sha256
          if-no-files-found: error
          retention-days: 90

      # success() rather than always(): a summary headed "Published to crates.io"
      # under a failed publish step would be a false record of a release.
      - name: Write the job summary
        if: success()
        run: |
          @(
              '# Published to crates.io',
              '',
              '| | |',
              '|---|---|',
              "| crate | ``d3-format`` |",
              "| version | ``${{ needs.verify.outputs.version }}`` |",
              "| tag | ``$env:GITHUB_REF_NAME`` |",
              "| commit | ``$env:GITHUB_SHA`` |",
              "| artifact | ``${{ needs.verify.outputs.crate }}`` |",
              "| sha256 | ``${{ needs.verify.outputs.sha256 }}`` |"
          ) -join [Environment]::NewLine | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
