name: Pre-release differential

# Section 6.3 of MIGRATION_TO_RUST.md: "A scheduled workflow runs the versioned
# pre-release corpus, at least 10,000,000 formatter comparisons, and uploads the
# seed, manifest, mismatch artifacts, and summary. Unchanged state is not success
# unless the command completed and reported the expected case count."
#
# That last sentence is why this workflow does not simply run a command and trust
# its exit code. The runner writes a machine-readable summary, and the step after
# it re-asserts the counts *out of that artifact*: the artifact is what a human
# reviews weeks later, so it must not be able to record less than the gate demands.
#
# It is a separate workflow rather than a job in test.yml because it has a
# different trigger and a different cost. Section 1's repository tree predates it
# and lists only test.yml, publish.yml and publish-rust.yml.

on:
  schedule:
    # Weekly, at an off-peak time that is not on the hour. The corpus is a pure
    # function of the seed, so a scheduled run only finds something new when the
    # port, the fixtures or the engine changed -- which is exactly when it should.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: Corpus seed. The default reproduces the archived run.
        required: false
        default: "1"
      cases:
        description: >-
          Drawn formatter cases. Roughly one drawn specifier in fifteen is type `c`
          and is a policy check rather than an output comparison, so the default
          carries the headroom that keeps section 6.3's ten million *comparisons*
          reachable.
        required: false
        default: "11000000"

permissions:
  contents: read

jobs:
  prerelease-differential:
    runs-on: ubuntu-latest
    # The run compares over thirteen million cases. It takes minutes on a quiet
    # workstation and rather longer on a hosted runner; the limit is generous so a
    # slow runner reports a result rather than a timeout, and low enough that a
    # hung job does not burn six hours.
    timeout-minutes: 240
    env:
      # Section 6.3's caveat: rustup resolves rust-toolchain.toml by walking up
      # from the working directory, and these steps run from the repository root
      # where that file is not on the path. differential.mjs passes
      # --manifest-path rust/Cargo.toml, and this pins the compiler outright rather
      # than inheriting the image default.
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
      DIFFERENTIAL_SEED: ${{ inputs.seed || '1' }}
      DIFFERENTIAL_CASES: ${{ inputs.cases || '11000000' }}
      SUMMARY_PATH: rust/target/differential/prerelease-summary.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: yarn
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      # rust/tools/harvest.mjs imports acorn and every other tool imports
      # harvest.mjs, so the differential needs node_modules.
      - run: yarn --frozen-lockfile

      # Before comparing anything: the engine must still be the recorded oracle.
      # A Node, V8 or ICU change would otherwise be reported as ten million port
      # defects.
      - run: node rust/tools/check-oracle-metadata.mjs

      - run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Section 4.3's per-bucket census of the structured corpora, which this run
      # then executes in full. Checking it here means a generator that quietly
      # stopped producing a bucket fails before the ten-million-case run, not after.
      - run: node rust/tools/gen-corpus.mjs --check-manifest

      # --release, unlike the per-PR job. This is the one run where throughput
      # decides whether the gate is affordable; the per-PR differential keeps the
      # debug profile so that Rust's integer overflow checks stay live.
      - name: Run the pre-release differential
        shell: pwsh
        run: |
          node --max-old-space-size=8192 rust/tools/differential.mjs `
            --corpus prerelease `
            --seed $env:DIFFERENTIAL_SEED `
            --cases $env:DIFFERENTIAL_CASES `
            --release `
            --summary $env:SUMMARY_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "the pre-release differential failed with exit code $LASTEXITCODE"
          }

      # Section 6.3's "reported the expected case count", asserted against the
      # artifact rather than against the console. Every number here is one the
      # runner counted while comparing, not one this workflow assumed.
      - name: Assert the reported case counts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:SUMMARY_PATH)) {
              throw "no summary at $env:SUMMARY_PATH: the run did not complete"
          }
          $summary = Get-Content -LiteralPath $env:SUMMARY_PATH -Raw | ConvertFrom-Json

          $problems = @()
          if ($summary.status -ne 'agreement') {
              $problems += "status is '$($summary.status)', not 'agreement'"
          }
          if ($summary.cases.findings -ne 0) {
              $problems += "$($summary.cases.findings) disagreement(s)"
          }
          if ($summary.cases.unimplemented -ne 0) {
              $problems += "$($summary.cases.unimplemented) case(s) reported unimplemented"
          }
          if ($summary.census_problems.Count -ne 0) {
              $problems += $summary.census_problems
          }

          # Section 6.3's headline number.
          $comparisons = [long] $summary.formatter.output_comparisons
          if ($comparisons -lt 10000000) {
              $problems += "only $comparisons formatter output comparison(s); section 6.3 requires at least 10000000"
          }
          if ([int] $summary.by_section.random -ne [int] $summary.requested_drawn_cases) {
              $problems += "asked for $($summary.requested_drawn_cases) drawn case(s) and compared $($summary.by_section.random)"
          }

          # The complete structured corpora, which section 7's Phase 5 exit requires
          # alongside the ten million. `regressions` is empty until a differential
          # pins a case, so it is the one declared section allowed to contribute none.
          foreach ($section in @('calls', 'decimal', 'boundary', 'fixed_ties', 'significant_ties', 'carry', 'sweep', 'random')) {
              $count = [int] $summary.by_section.$section
              if ($count -le 0) { $problems += "section '$section' contributed no case" }
          }

          # Section 7's per-locale floor.
          if (-not $summary.locale_coverage.floor_applied) {
              $problems += 'the per-locale floor was not applied, so the 59-locale differential proved nothing'
          }
          if ([int] $summary.locale_coverage.minimum.count -lt [int] $summary.locale_coverage.floor) {
              $problems += "locale $($summary.locale_coverage.minimum.name) drew $($summary.locale_coverage.minimum.count), below the floor of $($summary.locale_coverage.floor)"
          }

          if ($problems.Count -ne 0) {
              foreach ($problem in $problems) { Write-Host "FAIL: $problem" }
              throw 'the pre-release differential did not report the expected case counts'
          }

          Write-Host "seed $($summary.seed): $($summary.cases.asked) case(s) compared, $comparisons formatter output comparison(s), 0 disagreements"

      - name: Write the job summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:SUMMARY_PATH)) { return }
          $summary = Get-Content -LiteralPath $env:SUMMARY_PATH -Raw | ConvertFrom-Json
          $lines = @(
              '# Pre-release differential',
              '',
              "| | |",
              "|---|---|",
              "| status | ``$($summary.status)`` |",
              "| seed | $($summary.seed) |",
              "| oracle | Node $($summary.oracle.node), V8 $($summary.oracle.v8), ICU $($summary.oracle.icu) |",
              "| cases compared | $($summary.cases.asked) |",
              "| formatter output comparisons | $($summary.formatter.output_comparisons) |",
              "| declined by policy | $($summary.formatter.declined_by_policy) |",
              "| disagreements | $($summary.cases.findings) |",
              "| wall clock | $([math]::Round($summary.duration_ms / 60000.0, 1)) min |",
              '',
              '## Sections',
              '',
              '| section | cases |',
              '|---|---|'
          )
          foreach ($property in $summary.by_section.PSObject.Properties) {
              $lines += "| $($property.Name) | $($property.Value) |"
          }
          $lines += @(
              '',
              '## Locale coverage',
              '',
              "$($summary.locale_coverage.named_locales) named locales over $($summary.locale_coverage.drawn) drawn cases;",
              "floor $($summary.locale_coverage.floor)",
              "(applied: $($summary.locale_coverage.floor_applied)),",
              "least $($summary.locale_coverage.minimum.name)=$($summary.locale_coverage.minimum.count),",
              "most $($summary.locale_coverage.maximum.name)=$($summary.locale_coverage.maximum.count)."
          )
          $lines -join [Environment]::NewLine | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Section 6.3: the seed, the manifest, the mismatch artifacts and the summary.
      # The seed is inside the summary; the mismatch files exist only when the run
      # found something, which is why this tolerates their absence.
      - name: Upload the differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-differential-${{ github.run_id }}
          path: |
            rust/target/differential/
            rust/fixtures/d3-format-3.1.2/manifest.json
            rust/fixtures/d3-format-3.1.2/corpus-manifest.json
            rust/fixtures/d3-format-3.1.2/oracle.json
          if-no-files-found: error
          retention-days: 90
