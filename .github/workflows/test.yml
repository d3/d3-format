name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn test
      - run: yarn lint

  # The Rust gates below implement sections 6.1 and 6.2 of MIGRATION_TO_RUST.md,
  # and the `parity` job at the end of this file implements section 6.3. That job
  # was deliberately absent until Phase 5 because it invokes rust/tools/*.mjs and
  # section 6 requires every script to be committed before a workflow references
  # them; those tools landed in Phase 1 and the formatter side they exercise landed
  # in Phase 4.
  #
  # Every Rust job sets RUSTUP_TOOLCHAIN. rust/rust-toolchain.toml pins channel
  # 1.98.1 and rustup honors it for any command run from inside rust/, which is
  # every step here. The environment variable takes precedence over the toolchain
  # file, so it is what actually selects the compiler; a job that omitted it would
  # install one toolchain and then silently build with 1.98.1.

  rust-pinned:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: 1.98.1-x86_64-unknown-linux-gnu
          - os: windows-latest
            toolchain: 1.98.1-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      # Section 2.2's highest-risk unverified assumption, made self-diagnosing.
      # On a GNU host the dev-dependency graph reaches windows-sys through
      # criterion, and its raw-dylib import libraries are built by MinGW's
      # `dlltool`, which rustc resolves from PATH only -- so a runner without it
      # fails the whole job with `error calling dlltool 'dlltool.exe': program not
      # found`, and never gets as far as the benchmark Phase 5 added. This step
      # says outright whether the image provides it and, if it is merely not on
      # PATH, puts it there. It warns rather than fails when nothing is found, so
      # the first execution still produces the linker error section 2.2 asks to be
      # captured rather than masking it with an error of this step's own.
      - name: Locate MinGW dlltool
        if: runner.os == 'Windows'
        run: |
          $found = Get-Command dlltool.exe -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "dlltool already on PATH: $($found.Source)"
            exit 0
          }
          $candidates = @(
            'C:\msys64\mingw64\bin',
            'C:\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\Strawberry\c\bin'
          )
          $directory = $candidates | Where-Object { Test-Path (Join-Path $_ 'dlltool.exe') } | Select-Object -First 1
          if ($directory) {
            Write-Host "dlltool found in $directory; appending it to PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $directory
            exit 0
          }
          Write-Host '::warning::no MinGW dlltool on this image; the criterion -> windows-sys raw-dylib link is expected to fail (MIGRATION_TO_RUST.md section 2.2). Install mingw-w64 binutils in this job.'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: ./ci/check.ps1 -Profile Pinned

  rust-msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.80.0-x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      # No rustfmt or clippy: the Msrv profile runs the four feature-combination
      # test runs only. This job consumes the committed lockfile and never writes
      # one; cargo 1.80 predates resolver.incompatible-rust-versions and would
      # reselect a clap release it cannot parse.
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: ./ci/check.ps1 -Profile Msrv

  # Moving compatibility coverage, per section 6.2. It does not define fixture
  # semantics; pinned 1.98.1 does. As of Phase 5, stable still *is* 1.98.1, so this
  # job builds the same compiler as rust-pinned and is not yet evidence of forward
  # compatibility. That is expected and self-correcting once stable advances; until
  # then only rust-msrv exercises a genuinely different compiler.
  rust-stable:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: ./ci/check.ps1 -Profile Pinned

  rust-wasm:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      # rustup adds a target to one toolchain, so RUSTUP_TOOLCHAIN must already be
      # in effect. Without it the target lands in the runner's default toolchain
      # while the check below runs under the one rust-toolchain.toml selects, and
      # the build fails with "can't find crate for `std`".
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Section 0.1 requires the core to keep compiling for wasm32. This is a
      # compile check only; it is not a claim that a usable JS/WASM API exists.
      - run: cargo check --target wasm32-unknown-unknown --no-default-features

  # Section 6.3. The JavaScript product is the oracle, so this job runs it first,
  # then re-derives every generated artifact from it and byte-compares, then asks
  # the two implementations the same 200,000 questions.
  parity:
    runs-on: ubuntu-latest
    # The differential builds and runs rust/src/bin/dump_cases. Section 6.3 notes
    # that the runner must invoke it with --manifest-path rust/Cargo.toml, or set
    # its child working directory to rust/, rather than relying on toolchain
    # discovery from the repository root: rustup resolves rust-toolchain.toml by
    # walking up from the *working directory*, and these steps run from the root,
    # where that file is not on the path. differential.mjs passes --manifest-path,
    # and RUSTUP_TOOLCHAIN below removes the remaining ambiguity by pinning the
    # compiler explicitly instead of inheriting whatever the image defaults to.
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      # Section 1's `text eol=lf` rule, checked rather than trusted, and checked
      # first because it is one git command and everything below it byte-compares
      # something. It is the sibling of the drift clause at the end of this job:
      # that one catches a generated file missing from the commit, this one catches
      # a committed file whose checked-out bytes are not the bytes the rule
      # declares. Neither is visible to the other, and neither is visible to
      # `git status` -- a path git itself checked out as CRLF still matches the stat
      # data cached in the index, so status reports nothing at all.
      #
      # The failure it can find here is not the one it finds on Windows. Checkout on
      # this runner writes LF whatever the attribute says, so a `w/crlf` finding is
      # nearly impossible; what an Ubuntu leg catches is an `i/crlf` index copy,
      # committed from somewhere the attribute did not apply, which would then be
      # CRLF on every platform. Same command, and it has to hold in both places.
      - name: Line endings match .gitattributes
        shell: pwsh
        run: ./rust/ci/assert-line-endings.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: yarn
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      # rust/tools/harvest.mjs imports acorn, and every other tool imports
      # harvest.mjs, so the differential needs node_modules even though the d3
      # source it formats with has no runtime dependencies.
      - run: yarn --frozen-lockfile
      - run: yarn vitest run
      - run: yarn lint
      - run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: node rust/tools/check-oracle-metadata.mjs
      - run: node rust/tools/harvest.mjs --check
      - run: node rust/tools/check-coverage.mjs
      - run: node rust/tools/gen-tests.mjs --check
      - run: node rust/tools/gen-locales.mjs --check
      - run: node rust/tools/gen-corpus.mjs --check-manifest
      # Section 6.3 spells this `--corpus ci --seed 1 --cases 200000`. `ci` is a
      # named corpus defined in differential.mjs: the recorded calls, the recorded
      # ECMAScript conversions, the pinned regressions, section 4.1's boundary
      # corpus, and 200,000 drawn formatter comparisons across all 59 locales.
      # No --release: the debug profile keeps Rust's integer overflow checks live,
      # which is the stronger reading of "no accepted input panics", and the run
      # still finishes in a few minutes. The scheduled pre-release differential is
      # the one that trades those checks for throughput.
      - run: node rust/tools/differential.mjs --corpus ci --seed 1 --cases 200000
      # Section 3.7's final clause. The --check tools above prove the generated
      # bytes are the bytes a fresh generation produces; this proves nothing
      # generated is missing from the commit. It is deliberately not narrowed to
      # modified-and-deleted entries: in a committed tree, a regenerated file
      # showing up as untracked is itself drift.
      - name: Generated artifacts are not dirty
        shell: pwsh
        run: |
          $status = git status --porcelain -- rust/fixtures rust/tests/generated rust/src/locales/generated.rs
          if ($status) { throw "generated artifacts are dirty:`n$($status -join [Environment]::NewLine)" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-differential
          path: |
            rust/target/differential/
          if-no-files-found: ignore
